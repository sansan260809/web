<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生考号生成器</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f2f5; margin: 0; padding: 15px; color: #333;
    font-size: 14px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { text-align: center; color: #1a73e8; margin-bottom: 5px; font-size: 20px; }
  .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 12px; }

  .card {
    background: #fff; border-radius: 10px; padding: 16px;
    margin-bottom: 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  .card h2 {
    font-size: 15px; margin: 0 0 12px; color: #1a73e8;
    border-left: 4px solid #1a73e8; padding-left: 10px;
  }

  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .field { display: flex; align-items: center; gap: 6px; }
  .field label { font-size: 13px; white-space: nowrap; }
  input[type="text"], input[type="number"] {
    padding: 7px 10px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px; width: 80px;
  }
  input[type="file"] { font-size: 13px; width: 100%; }

  button {
    padding: 9px 18px; border: none; border-radius: 6px;
    font-size: 14px; cursor: pointer; transition: 0.2s;
  }
  .btn-primary { background: #1a73e8; color: #fff; }
  .btn-primary:hover { background: #1557b0; }
  .btn-success { background: #34a853; color: #fff; }
  .btn-success:hover { background: #2a8a44; }
  .btn-danger { background: #ea4335; color: #fff; padding: 5px 10px; font-size: 13px; }
  .btn-danger:hover { background: #c5221f; }
  .btn-sm { padding: 6px 14px; font-size: 13px; }
  button:disabled { background: #ccc !important; cursor: not-allowed; }

  #roomList { display: flex; flex-direction: column; gap: 8px; }
  .room-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: #f8f9fa; border-radius: 6px;
    flex-wrap: wrap;
  }
  .room-item span { font-size: 13px; min-width: 65px; }
  .room-item input { width: 70px; }

  #status, #genStatus {
    padding: 10px 14px; border-radius: 6px; font-size: 13px;
    margin-top: 10px; display: none;
  }
  .status-ok { background: #e6f4ea; color: #137333; display: block !important; }
  .status-warn { background: #fef7e0; color: #b06000; display: block !important; }
  .status-err { background: #fce8e6; color: #c5221f; display: block !important; }

  .table-wrap { overflow-x: auto; max-height: 60vh; overflow-y: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid #e0e0e0; padding: 6px 8px; text-align: center; white-space: nowrap; }
  th { background: #1a73e8; color: #fff; position: sticky; top: 0; }
  tr:nth-child(even) { background: #f8f9fa; }

  .summary { font-size: 13px; color: #555; margin-top: 8px; }
  .hidden { display: none; }
  .tip { font-size: 12px; color: #888; margin-top: 6px; }
  .warn-text { color: #ea4335; }

  /* 下载遮罩 */
  #downloadMask {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 9999;
    display: none; align-items: center; justify-content: center;
  }
  #downloadMask .mask-box {
    background: #fff; padding: 25px 35px; border-radius: 12px;
    text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  #downloadMask .mask-box p { margin: 10px 0 0; font-size: 14px; color: #333; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto;
    border: 4px solid #e0e0e0; border-top-color: #1a73e8;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <h1>学生考号生成器</h1>
  <p class="subtitle">年级(2) + 班级(2) + 考场号(2) + 座位号(2) + 学号后四位(4)</p>

  <!-- 1. 基本设置 -->
  <div class="card">
    <h2>① 基本设置</h2>
    <div class="row">
      <div class="field">
        <label>年级代码：</label>
        <input type="text" id="grade" value="24" maxlength="2">
      </div>
      <div class="field">
        <label>学号后取：</label>
        <input type="number" id="idSuffix" value="4" min="1" max="8" style="width:55px">
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field">
        <label><input type="checkbox" id="gridMode"> 前后左右都算相邻</label>
      </div>
      <div class="field">
        <label>每排座位：</label>
        <input type="number" id="perRow" value="6" min="1" style="width:55px">
      </div>
    </div>
    <p class="tip">开启后按每排N个的网格排布，前后左右都不同班。</p>
  </div>

  <!-- 2. 导入学生 -->
  <div class="card">
    <h2>② 导入学生名单</h2>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
    <p class="tip">Excel需含列：姓名、学号、班级（列名完全一致）</p>
    <div id="status"></div>
    <div class="summary" id="studentSummary"></div>
  </div>

  <!-- 3. 考场设置 -->
  <div class="card">
    <h2>③ 设置各考场人数</h2>
    <div id="roomList"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn-primary btn-sm" onclick="addRoom()">+ 添加考场</button>
      <button class="btn-primary btn-sm" onclick="autoFillRooms()">按总人数平均分配</button>
    </div>
    <div class="summary" id="roomSummary"></div>
  </div>

  <!-- 4. 生成 -->
  <div class="card">
    <h2>④ 生成考号</h2>
    <div class="row">
      <button class="btn-success" id="genBtn" onclick="generate()" disabled>开始生成</button>
      <button class="btn-primary" id="exportBtn" onclick="exportExcel()" disabled>导出Excel</button>
    </div>
    <div id="genStatus"></div>
    <div class="summary" id="genSummary"></div>
  </div>

  <!-- 5. 结果 -->
  <div class="card hidden" id="resultCard">
    <h2>⑤ 生成结果</h2>
    <div class="table-wrap">
      <table id="resultTable">
        <thead>
          <tr>
            <th>考号</th><th>姓名</th><th>学号</th><th>班级</th><th>考场号</th><th>座位号</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 下载遮罩 -->
<div id="downloadMask">
  <div class="mask-box">
    <div class="spinner"></div>
    <p id="maskText">正在准备下载，请稍候…</p>
  </div>
</div>

<script>
// ============ 全局数据 ============
let students = [];
let rooms = [30];
let result = [];

// ============ 工具函数 ============
function showStatus(el, msg, type) {
  el.textContent = msg;
  el.className = 'status-' + type;
}
function zfill(num, len) {
  return String(num).padStart(len, '0');
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ============ 考场设置 ============
function renderRooms() {
  const list = document.getElementById('roomList');
  list.innerHTML = '';
  rooms.forEach((size, i) => {
    const div = document.createElement('div');
    div.className = 'room-item';
    div.innerHTML = `
      <span>考场 ${i + 1}：</span>
      <input type="number" min="1" value="${size}" onchange="updateRoom(${i}, this.value)">
      <span style="color:#888">人</span>
      <button class="btn-danger" onclick="removeRoom(${i})">删除</button>
    `;
    list.appendChild(div);
  });
  updateRoomSummary();
}
function addRoom() {
  const last = rooms.length ? rooms[rooms.length - 1] : 30;
  rooms.push(last);
  renderRooms();
}
function removeRoom(i) {
  if (rooms.length <= 1) { alert('至少保留一个考场'); return; }
  rooms.splice(i, 1);
  renderRooms();
}
function updateRoom(i, val) {
  rooms[i] = Math.max(1, parseInt(val) || 1);
  updateRoomSummary();
}
function autoFillRooms() {
  if (!students.length) { alert('请先导入学生名单'); return; }
  const n = rooms.length || 1;
  const total = students.length;
  const base = Math.floor(total / n);
  const rem = total % n;
  rooms = rooms.map((_, i) => base + (i < rem ? 1 : 0));
  renderRooms();
}
function updateRoomSummary() {
  const total = rooms.reduce((a, b) => a + b, 0);
  const el = document.getElementById('roomSummary');
  el.innerHTML = `共 <b>${rooms.length}</b> 个考场，总容量 <b>${total}</b> 人` +
    (students.length ? `，学生 <b>${students.length}</b> 人` +
      (total < students.length ? ` <span class="warn-text">（容量不足！）</span>` : '') : '');
}

// ============ 导入学生 ============
document.getElementById('fileInput').addEventListener('change', function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (evt) {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      if (!rows.length) {
        showStatus(document.getElementById('status'), '文件为空', 'err');
        return;
      }
      const keys = Object.keys(rows[0]);
      if (!keys.includes('姓名') || !keys.includes('学号') || !keys.includes('班级')) {
        showStatus(document.getElementById('status'),
          '缺少必要列！需要：姓名、学号、班级。当前列：' + keys.join('、'), 'err');
        return;
      }

      const suffixLen = parseInt(document.getElementById('idSuffix').value) || 4;
      students = [];
      let skipped = 0;
      rows.forEach(r => {
        const sid = String(r['学号']).trim();
        if (!/^\d{8,}$/.test(sid)) { skipped++; return; }
        students.push({
          姓名: String(r['姓名']).trim(),
          学号: sid,
          班级: String(r['班级']).trim(),
          后四位: sid.slice(-suffixLen)
        });
      });

      const dup = checkSuffixDup();
      let msg = `成功导入 ${students.length} 名学生` + (skipped ? `，跳过 ${skipped} 条无效学号` : '');
      let type = 'ok';
      if (dup.length) {
        msg += `。注意：有 ${dup.length} 组学号后${suffixLen}位重复！`;
        type = 'warn';
      }
      showStatus(document.getElementById('status'), msg, type);
      document.getElementById('studentSummary').innerHTML =
        `班级数：<b>${new Set(students.map(s => s.班级)).size}</b>`;
      updateRoomSummary();
      document.getElementById('genBtn').disabled = students.length === 0;
    } catch (err) {
      showStatus(document.getElementById('status'), '读取失败：' + err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
});

function checkSuffixDup() {
  const map = {};
  students.forEach(s => { map[s.后四位] = (map[s.后四位] || 0) + 1; });
  return Object.keys(map).filter(k => map[k] > 1);
}

// ============ 随机分配考场 ============
function assignRooms() {
  const arr = students.slice();
  shuffle(arr);
  const res = [];
  let idx = 0;
  rooms.forEach((size, i) => {
    res.push({ roomNo: i + 1, members: arr.slice(idx, idx + size) });
    idx += size;
  });
  if (idx < arr.length) {
    res[res.length - 1].members = res[res.length - 1].members.concat(arr.slice(idx));
  }
  return res;
}

// ============ 考场内排座 ============
function arrangeSeats(members, gridMode, perRow) {
  const total = members.length;
  const groups = {};
  members.forEach(s => {
    (groups[s.班级] = groups[s.班级] || []).push(s);
  });
  Object.values(groups).forEach(g => shuffle(g));

  const seats = new Array(total).fill(null);

  function conflict(pos, cls) {
    if (!gridMode) {
      if (pos > 0 && seats[pos - 1] && seats[pos - 1].班级 === cls) return true;
      if (pos < total - 1 && seats[pos + 1] && seats[pos + 1].班级 === cls) return true;
    } else {
      const row = Math.floor(pos / perRow), col = pos % perRow;
      const neighbors = [];
      if (col > 0) neighbors.push(pos - 1);
      if (col < perRow - 1 && pos + 1 < total) neighbors.push(pos + 1);
      if (row > 0) neighbors.push(pos - perRow);
      if (pos + perRow < total) neighbors.push(pos + perRow);
      for (const n of neighbors) {
        if (seats[n] && seats[n].班级 === cls) return true;
      }
    }
    return false;
  }

  for (let pos = 0; pos < total; pos++) {
    const classOrder = Object.keys(groups)
      .filter(c => groups[c].length > 0)
      .sort((a, b) => groups[b].length - groups[a].length);
    let placed = false;
    for (const cls of classOrder) {
      if (!conflict(pos, cls)) {
        seats[pos] = groups[cls].pop();
        placed = true;
        break;
      }
    }
    if (!placed) {
      const cls = classOrder[0];
      if (cls) seats[pos] = groups[cls].pop();
    }
  }

  function hasConflictAt(pos) {
    if (!seats[pos]) return false;
    const cls = seats[pos].班级;
    const totalN = seats.length;
    const list = [];
    if (!gridMode) {
      if (pos > 0) list.push(pos - 1);
      if (pos < totalN - 1) list.push(pos + 1);
    } else {
      const col = pos % perRow;
      if (col > 0) list.push(pos - 1);
      if (col < perRow - 1 && pos + 1 < totalN) list.push(pos + 1);
      if (pos - perRow >= 0) list.push(pos - perRow);
      if (pos + perRow < totalN) list.push(pos + perRow);
    }
    return list.some(n => seats[n] && seats[n].班级 === cls);
  }

  // 二次修正
  for (let round = 0; round < 5; round++) {
    let fixed = false;
    for (let i = 0; i < total; i++) {
      if (!seats[i]) continue;
      const checkList = [];
      if (!gridMode) {
        if (i + 1 < total) checkList.push(i + 1);
      } else {
        const col = i % perRow;
        if (col < perRow - 1 && i + 1 < total) checkList.push(i + 1);
        if (i + perRow < total) checkList.push(i + perRow);
      }
      for (const j of checkList) {
        if (seats[j] && seats[j].班级 === seats[i].班级) {
          for (let k = 0; k < total; k++) {
            if (k === i || k === j || !seats[k]) continue;
            if (seats[k].班级 === seats[i].班级) continue;
            const tmp = seats[j];
            seats[j] = seats[k];
            seats[k] = tmp;
            if (!hasConflictAt(j) && !hasConflictAt(k) && !hasConflictAt(i)) {
              fixed = true;
              break;
            }
            seats[k] = seats[j];
            seats[j] = tmp;
          }
        }
      }
    }
    if (!fixed) break;
  }

  return seats;
}

// ============ 生成主流程 ============
function generate() {
  const grade = document.getElementById('grade').value.trim() || '00';
  const suffixLen = parseInt(document.getElementById('idSuffix').value) || 4;
  const gridMode = document.getElementById('gridMode').checked;
  const perRow = parseInt(document.getElementById('perRow').value) || 6;

  if (!students.length) { alert('请先导入学生'); return; }
  const totalCap = rooms.reduce((a, b) => a + b, 0);
  if (totalCap < students.length) {
    if (!confirm(`考场总容量 ${totalCap} 小于学生数 ${students.length}，最后一个考场会超员。继续？`)) return;
  }

  const roomAssign = assignRooms();
  result = [];

  roomAssign.forEach(room => {
    const seats = arrangeSeats(room.members, gridMode, perRow);
    seats.forEach((s, i) => {
      if (!s) return;
      const seatNo = i + 1;
      const examNo = zfill(grade, 2) + zfill(s.班级, 2) +
                     zfill(room.roomNo, 2) + zfill(seatNo, 2) +
                     zfill(s.后四位, suffixLen);
      result.push({
        考号: examNo, 姓名: s.姓名, 学号: s.学号, 班级: s.班级,
        考场号: room.roomNo, 座位号: seatNo
      });
    });
  });

  // 统计冲突
  let conflictCount = 0;
  const byRoom = {};
  result.forEach(r => {
    (byRoom[r.考场号] = byRoom[r.考场号] || []).push(r);
  });
  Object.values(byRoom).forEach(list => {
    list.sort((a, b) => a.座位号 - b.座位号);
    for (let i = 0; i < list.length - 1; i++) {
      if (list[i].班级 === list[i + 1].班级) conflictCount++;
    }
  });

  document.getElementById('exportBtn').disabled = false;

  const gs = document.getElementById('genStatus');
  if (conflictCount === 0) {
    showStatus(gs, `生成成功！共 ${result.length} 条，无相邻同班冲突。`, 'ok');
  } else {
    showStatus(gs, `生成完成，共 ${result.length} 条。注意：仍有 ${conflictCount} 处左右相邻同班。`, 'warn');
  }
  document.getElementById('genSummary').innerHTML =
    `考场数：<b>${rooms.length}</b>，学生数：<b>${result.length}</b>`;

  renderResult();
}

// ============ 渲染结果 ============
function renderResult() {
  const card = document.getElementById('resultCard');
  const tbody = document.querySelector('#resultTable tbody');
  tbody.innerHTML = '';
  const sorted = result.slice().sort((a, b) =>
    a.考场号 - b.考场号 || a.座位号 - b.座位号);
  sorted.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.考号}</td><td>${r.姓名}</td><td>${r.学号}</td>
                    <td>${r.班级}</td><td>${r.考场号}</td><td>${r.座位号}</td>`;
    tbody.appendChild(tr);
  });
  card.classList.remove('hidden');
}

// ============ 导出Excel（WebCat 兼容版）============
function exportExcel() {
  if (!result.length) { alert('请先生成考号'); return; }

  // 显示下载遮罩
  const mask = document.getElementById('downloadMask');
  const maskText = document.getElementById('maskText');
  maskText.textContent = '正在准备下载，请稍候…';
  mask.style.display = 'flex';

  // 用 setTimeout 让遮罩先渲染出来，避免卡顿
  setTimeout(function () {
    try {
      // 1. 生成数据
      const sorted = result.slice().sort((a, b) =>
        a.考场号 - b.考场号 || a.座位号 - b.座位号);
      const ws = XLSX.utils.json_to_sheet(sorted, {
        header: ['考号', '姓名', '学号', '班级', '考场号', '座位号']
      });
      ws['!cols'] = [{ wch: 16 }, { wch: 10 }, { wch: 14 },
                     { wch: 8 }, { wch: 8 }, { wch: 8 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '考号表');

      // 2. 转为二进制（关键：不用 writeFile，避免闪退）
      const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });

      // 3. 创建 Blob
      const blob = new Blob([wbout], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const fileName = '考号生成结果_' + timestamp() + '.xlsx';

      // 4. 用 a 标签触发下载（WebCat 会交给外部浏览器）
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.target = '_blank';   // 关键：强制外部打开
      a.rel = 'noopener';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();

      // 5. 清理
      setTimeout(function () {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        maskText.textContent = '下载已开始，请到浏览器或文件管理器查看';
        setTimeout(function () {
          mask.style.display = 'none';
        }, 1500);
      }, 800);

    } catch (err) {
      mask.style.display = 'none';
      alert('导出失败：' + err.message + '\n请确认 WebCat 已开启"支持打开外部应用"。');
    }
  }, 200);
}

function timestamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
         '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

// ============ 初始化 ============
renderRooms();
</script>
</body>
</html>
